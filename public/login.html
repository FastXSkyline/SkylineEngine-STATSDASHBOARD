<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090a10">
<title>Skyline Engine | Admin Login</title>
<link rel="stylesheet" href="/login.css">
<script src="/login.js" defer></script>
</head>
<body>
<main class="login-shell">
  <div class="login-glow"></div>
  <section class="login-card">
    <a class="brand" href="/" aria-label="Skyline Engine"><img class="brand-logo" src="https://raw.githubusercontent.com/FastXSkyline/SkylineEngine-STATSDASHBOARD/main/sellix_big.png" alt="Skyline Engine"></a>
    <div class="eyebrow"><span class="status-dot"></span> SECURE ADMIN ACCESS</div>
    <h1>Welcome <span>back.</span></h1>
    <p class="subtitle">Sign in to your Skyline Engine command surface.</p>
    <form id="loginForm">
      <label for="username">KeyAuth username</label>
      <input id="username" name="username" type="text" autocomplete="username" placeholder="Username" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Password" required>
      <button id="loginBtn" type="submit">Sign in <span aria-hidden="true">↗</span></button>
    </form>
    <p id="message" class="message" role="status" aria-live="polite"></p>
    <div class="card-footer"><span><i></i> Protected dashboard</span><span>SKYLINE / ADMIN</span></div>
  </section>
  <footer>SKYLINE ENGINE <b>·</b> PRIVATE CONTROL PANEL</footer>
</main>
</body>
</html>
